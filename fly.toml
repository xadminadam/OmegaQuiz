# fly.toml app configuration file generated for omegaquiz on 2026-07-21T07:27:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'omegaquiz'
primary_region = 'syd'

[build]

[env]
  AUTO_PROVISION_SECRETS = 'true'
  DATA_DIR = '/app/data'
  NODE_ENV = 'production'
  PORT = '3000'
  PUBLIC_BASE_URL = 'https://omegaquiz.fly.dev'

[[mounts]]
  source = 'omegaquiz_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
